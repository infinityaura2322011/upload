<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Coding Monster</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#0b1017;color:#e8edf5;font-family:'Segoe UI',sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;flex-direction:column;gap:28px}
  .logo{width:80px;height:80px;border:3px solid #c6f36b;border-radius:30% 40% 28% 38%;transform:rotate(-8deg);position:relative;animation:pulse 1.4s ease-in-out infinite}
  .logo::before,.logo::after{content:'';position:absolute;width:12px;height:12px;border-radius:50%;background:#c6f36b;top:20px}
  .logo::before{left:16px}.logo::after{right:16px}
  .mouth{position:absolute;width:30px;height:8px;left:25px;bottom:16px;border-bottom:3px solid #c6f36b;border-radius:50%}
  h1{font-size:22px;letter-spacing:.2em;color:#c6f36b}
  p{color:#627086;font-size:13px;letter-spacing:.08em}
  .dots span{animation:blink 1.2s infinite;opacity:0}
  .dots span:nth-child(2){animation-delay:.2s}
  .dots span:nth-child(3){animation-delay:.4s}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(198,243,107,.3)}50%{box-shadow:0 0 0 12px rgba(198,243,107,0)}}
  @keyframes blink{0%,80%,100%{opacity:0}40%{opacity:1}}
</style>
</head>
<body>
<div class="logo"><div class="mouth"></div></div>
<h1>CODING MONSTER</h1>
<p>Starting engineering command center<span class="dots"><span>.</span><span>.</span><span>.</span></span></p>
</body>
</html>
